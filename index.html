<!doctype html><html lang="ko"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/><title>간빠 보고 페이지</title>
<style>
  :root{--paper:#F3F3F2;--card:#fff;--ink:#2A2A28;--quiet:#6B6A64;--line:#D9D9D6;--hl:#B8232F;--warn:#C0392B}
  @media(prefers-color-scheme:dark){:root{--paper:#1A1A18;--card:#232320;--ink:#EDEDE8;--quiet:#A8A79E;--line:#3A3A35;--warn:#E86A5C}}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
    font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif}
  body{display:flex;align-items:center;justify-content:center;padding:24px;word-break:keep-all}
  .box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:32px 30px;box-shadow:0 1px 3px rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.06)}
  .mk{width:22px;height:22px;background:var(--hl);border-radius:50%;margin-bottom:18px}
  h1{font-size:19px;font-weight:700;margin:0 0 5px}
  p{font-size:14px;color:var(--quiet);margin:0 0 20px;line-height:1.55}
  input{width:100%;font-family:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);
    border-radius:9px;background:var(--paper);color:var(--ink)}
  input:focus{outline:none;border-color:var(--ink)}
  button{width:100%;margin-top:12px;font-family:inherit;font-size:15px;font-weight:600;padding:13px;
    border:1px solid var(--ink);border-radius:9px;background:var(--ink);color:var(--paper);cursor:pointer}
  button:disabled{opacity:.5;cursor:progress}
  .err{margin-top:13px;font-size:13.5px;color:var(--warn);font-weight:600;display:none}
  .err.on{display:block}
  .foot{margin-top:22px;font-size:12px;color:var(--quiet)}
</style></head><body>
<form class="box" id="f"><div class="mk"></div>
  <h1>간빠 보고 페이지</h1>
  <p>전달받은 암호를 입력해 주세요.</p>
  <input type="password" id="pw" autocomplete="current-password" autofocus/>
  <button type="submit" id="go">열기</button>
  <div class="err" id="err"></div>
  <div class="foot">유니크플랜 · 정진영</div>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(PAYLOAD.salt),iterations:ITER,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.data));
  return new TextDecoder().decode(plain);
}
async function attempt(pw,silent){
  try{const html=await unlock(pw);try{sessionStorage.setItem(KEY,pw)}catch(e){}
    document.open();document.write(html);document.close();return true}
  catch(e){if(!silent){const el=document.getElementById('err');
    el.textContent='암호가 맞지 않습니다. 다시 확인해 주세요.';el.classList.add('on')}return false}
}
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const btn=document.getElementById('go'),pw=document.getElementById('pw').value;
  if(!pw)return;document.getElementById('err').classList.remove('on');
  btn.disabled=true;btn.textContent='여는 중…';
  const ok=await attempt(pw,false);
  if(!ok){btn.disabled=false;btn.textContent='열기';document.getElementById('pw').select()}
});
(async()=>{let s=null;try{s=sessionStorage.getItem(KEY)}catch(e){}if(s)await attempt(s,true)})();
